<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Zen Kurenaido', 'Helvetica Neue', Arial, sans-serif;
        }

        #mirror-container {
            position: relative;
            width: 100%;
            height: 100%;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            /* 鏡のように反転 */
            transition: filter 0.1s ease;
        }

        /* ---- レイヤー構成 ----
           1. #bg-image   : お風呂場の背景画像 (最下層)
           2. video       : ウェブカメラ映像 (半透明で重ねる)
           3. canvas      : 結露エフェクト   (最上層)
        */
        #bg-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.6); /* 少し暗く */
        }

        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
            opacity: 0.55;           /* 背景画像と合成するため半透明 */
            mix-blend-mode: luminosity; /* 自然な合成モード */
            transition: filter 0.1s ease;
            touch-action: none;
            pointer-events: none;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: auto;
            transform: scaleX(-1);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ---- ファーストビュー（導入オーバーレイ） ---- */
        #intro-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(12, 10, 8, 0.78) 0%, rgba(5, 5, 5, 0.94) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 1;
            transition: opacity 1.4s cubic-bezier(0.25, 1, 0.5, 1), filter 1.4s cubic-bezier(0.25, 1, 0.5, 1), visibility 1.4s;
        }

        #intro-overlay.hidden {
            opacity: 0 !important;
            filter: blur(24px) !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        #intro-card {
            max-width: 620px;
            width: 86%;
            padding: 40px 32px;
            text-align: center;
            color: #ece4db;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .intro-time-tag {
            font-size: 14px;
            letter-spacing: 0.28em;
            color: #d4b28c;
            background: none;
            border: none;
            padding: 0;
            margin-top: -2px;
            margin-bottom: 2px;
            font-weight: 300;
            text-shadow: 0 0 12px rgba(212, 178, 140, 0.2);
        }

        .intro-sub-title {
            font-size: 13px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(220, 205, 190, 0.6);
            margin-bottom: -10px;
        }

        .intro-main-title {
            font-size: clamp(22px, 4vw, 32px);
            letter-spacing: 0.18em;
            color: #f5ede6;
            margin: 0;
            font-weight: 400;
            text-shadow: 0 0 20px rgba(255, 230, 200, 0.25);
        }

        .intro-divider {
            width: 48px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(230, 215, 200, 0.4), transparent);
            margin: 4px 0;
        }

        #intro-heading {
            font-size: clamp(17px, 3.2vw, 22px);
            letter-spacing: 0.12em;
            line-height: 1.6;
            color: #f7efe6;
            margin: 0;
            font-weight: 400;
        }

        #intro-body {
            font-size: clamp(14px, 2.6vw, 16px);
            letter-spacing: 0.08em;
            line-height: 2.1;
            color: rgba(230, 220, 210, 0.82);
            margin: 0;
            white-space: pre-line;
        }

        #intro-start-btn {
            margin-top: 10px;
            padding: 14px 34px;
            font-size: 15px;
            letter-spacing: 0.16em;
            font-family: inherit;
            color: #f5ebe1;
            background: rgba(255, 245, 235, 0.08);
            border: 1px solid rgba(255, 235, 220, 0.32);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            box-shadow: 0 0 25px rgba(240, 210, 180, 0.08);
            animation: pulseGlow 3.5s ease-in-out infinite;
        }

        #intro-start-btn:hover {
            background: rgba(255, 245, 235, 0.18);
            border-color: rgba(255, 240, 225, 0.65);
            box-shadow: 0 0 35px rgba(250, 220, 190, 0.25);
            transform: scale(1.02);
            color: #fff;
        }

        .intro-note {
            font-size: 11px;
            letter-spacing: 0.06em;
            color: rgba(200, 190, 180, 0.45);
            margin: 0;
        }

        /* ---- 鏡の中の操作ヒント ---- */
        #experience-hint {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 24px;
            background: rgba(18, 15, 12, 0.65);
            border: 1px solid rgba(240, 225, 210, 0.22);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #f2e9e1;
            font-size: 13px;
            letter-spacing: 0.12em;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #experience-hint.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .hint-main {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #f7efe6;
        }

        .hint-divider {
            color: rgba(220, 200, 180, 0.4);
            font-weight: 300;
        }

        .hint-sub {
            font-size: 11px;
            color: rgba(220, 210, 200, 0.65);
            letter-spacing: 0.08em;
        }

        @keyframes introFadeIn {
            0% {
                opacity: 0;
                filter: blur(6px);
                transform: scale(0.98);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1);
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                border-color: rgba(255, 235, 220, 0.28);
                box-shadow: 0 0 20px rgba(240, 210, 180, 0.06);
            }
            50% {
                border-color: rgba(255, 245, 235, 0.55);
                box-shadow: 0 0 30px rgba(250, 225, 200, 0.18);
            }
        }
    </style>
</head>

<body>

    <div id="mirror-container">
        <!-- 背景画像: お風呂場の結露した鏡 -->
        <img id="bg-image" src="bathroom_bg.jpg" alt="">
        <video id="webcam" autoplay muted playsinline></video>
        <canvas id="interactionCanvas"></canvas>
        <canvas id="condensation"></canvas>
        <!-- 日本語IME・全角・モバイルキーボード用の不可視入力欄 -->
        <textarea id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            style="position: fixed; opacity: 0; pointer-events: none; top: 0; left: 0; width: 10px; height: 10px; z-index: -1;"></textarea>

        <!-- 鏡体験中の操作ヒント（進入直後に自動フェードイン/フェードアウト） -->
        <div id="experience-hint">
            <div class="hint-main">
                <span>👇 指やマウスで画面を拭う</span>
                <span class="hint-divider">|</span>
                <span>⌨️ キーボードで文字を打つ</span>
            </div>
            <div class="hint-sub">※ 描いた線や言葉は 10秒 で湯気に溶けて消えます</div>
        </div>

        <!-- ファーストビュー（時間帯別メッセージオーバーレイ） -->
        <div id="intro-overlay">
            <div id="intro-card">
                <div class="intro-sub-title">Schrödinger’s Mirror</div>
                <h1 class="intro-main-title">シュレーディンガーの鏡</h1>
                <!-- 時間帯タイトルバッジ -->
                <div id="intro-time-tag" class="intro-time-tag">心の鎧をまとう前</div>
                <div class="intro-divider"></div>
                <h2 id="intro-heading">「ちゃんとした誰か」になる前の、ひとときに。</h2>
                <p id="intro-body">やがて朝の光と社会の視線が、あなたを一つの表情に縛りつける。
その前に、まだ輪郭のあいまいで未確定なあなたを、
この曇ったガラスにぶつけていってください。</p>
                <button id="intro-start-btn" onclick="startExperience()">［ 鏡の前に立つ ］</button>
                <p class="intro-note">※カメラを使用しますが、映像や入力情報は一切保存されません</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
